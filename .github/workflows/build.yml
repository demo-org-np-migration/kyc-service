name: build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: compute tag
        id: tag
        run: echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/demo-org-np-migration/kyc-service:${{ steps.tag.outputs.sha_tag }}

  deploy-staging:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: set staging image tag
        working-directory: deploy/overlays/staging
        run: kustomize edit set image ghcr.io/demo-org-np-migration/kyc-service=ghcr.io/demo-org-np-migration/kyc-service:${{ needs.build-push.outputs.sha_tag }}

      - name: commit staging overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/staging/kustomization.yaml
          git commit -m "chore: staging ${{ needs.build-push.outputs.sha_tag }} [skip ci]" || echo "nothing to commit"
          git push

  deploy-prod:
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: set prod image tag
        working-directory: deploy/overlays/prod
        run: kustomize edit set image ghcr.io/demo-org-np-migration/kyc-service=ghcr.io/demo-org-np-migration/kyc-service:${{ github.ref_name }}

      - name: commit prod overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/prod/kustomization.yaml
          git commit -m "chore: prod ${{ github.ref_name }} [skip ci]" || echo "nothing to commit"
          git push
